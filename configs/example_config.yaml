general:
  project_name: CRYPPO
  project_full_name: CRYPtocurrency Position Optimization
  version: 0.1.0
  description: ระบบจำลองการเทรดคริปโตที่สมจริงสำหรับการพัฒนาและทดสอบอัลกอริทึม Reinforcement
    Learning ขั้นสูง
  log_level: INFO
  random_seed: 42
  timezone: Asia/Bangkok
data:
  default_symbol: BTCUSDT
  default_timeframes:
  - 30m
  - 1h
  - 2h
  - 4h
  - 1d
  default_start_date: '2023-01-01'
  default_end_date: '2023-12-31'
  data_dir: data
  raw_dir: data/raw
  processed_dir: data/processed
  indicators_dir: data/indicators
  batch_size: 1024
  window_size: 60
  detail_timeframe: 30m
  base_timeframe: 4h
  file_format: parquet
  use_gpu_for_preprocessing: true
binance:
  base_url: https://api.binance.com/api/v3
  klines_endpoint: /klines
  exchange_info_endpoint: /exchangeInfo
  max_candles_per_request: 1000
  request_delay: 0.5
preprocessing:
  use_log_transform: true
  use_z_score: true
  handle_missing_values: true
  remove_outliers: false
  outlier_std_threshold: 3.0
  fill_missing_strategy: ffill
  make_iid_data: true
  iid:
    method: log_return
    volume_method: pct_change
    other_method: diff
    price_columns:
    - open
    - high
    - low
    - close
    volume_columns:
    - volume
    epsilon: 1.0e-08
    dropna: true
    fillna_value: 0.0
  min_data_points: 1000
  train_test_split_ratio: 0.8
  validation_set_ratio: 0.1
indicators:
  default_indicators:
  - rsi
  - macd
  - stochastic
  rsi_period: 14
  macd_fast_period: 12
  macd_slow_period: 26
  macd_signal_period: 9
  stochastic_k_period: 14
  stochastic_d_period: 3
  stochastic_slowing: 3
  bollinger_period: 20
  bollinger_std: 2.0
environment:
  initial_balance: 10000.0
  position_mode: fraction
  failure_penalty: -15.0
  fee_rate: 0.0025
  leverage: 5.0
  liquidation_threshold: 0.2
  stop_loss: null
  take_profit: null
  action_type: discrete
  slippage: 0.0005
  render_mode: null
  episode_length: null
  reward_function: alpha
  use_detail_timeframe: true
  use_transaction_costs: true
  use_liquidation: true
  use_realistic_slippage: true
  idle_penalty: 0.01
  position_size: 0.12
  max_position_steps: 960
  funding_rate: 5.0e-05
model:
  model_type: double_dqn
  learning_rate: 0.0002
  discount_factor: 0.99
  optimizer: adam
  loss_function: mse
  batch_size: 64
  target_update_frequency: 1000
  replay_buffer_size: 100000
  min_replay_buffer_size: 1000
  exploration_initial: 1.0
  exploration_final: 0.05
  exploration_decay: 0.999
  hidden_layers:
  - 512
  - 256
  - 128
  activation_function: relu
  use_batch_norm: true
  dropout_rate: 0.2
  weight_decay: 1.0e-05
  clip_grad_norm: 1.0
  double_q: true
  dueling: true
  noisy: false
  prioritized_replay: false
  alpha: 0.6
  beta: 0.4
  beta_increment: 0.001
  reg_lambda: 0.01
training:
  total_timesteps: 700000
  save_frequency: 10000
  eval_frequency: 5000
  log_frequency: 1000
  checkpoint_dir: outputs/models
  log_dir: outputs/logs
  use_tensorboard: true
  max_episode_steps: 720
  early_stopping_patience: 10
  early_stopping_threshold: 0.01
  num_eval_episodes: 5
backtest:
  start_date: null
  end_date: null
  initial_balance: 10000.0
  fee_rate: 0.0025
  leverage: 5.0
  use_stop_loss: true
  use_take_profit: true
  stop_loss: 0.12
  take_profit: 0.25
  plot_results: true
  save_trades: true
  output_dir: outputs/backtest_results
  verbose: true
cuda:
  use_cuda: true
  device: 0
  precision: float32
  memory_fraction: 0.7
  benchmark: true
  deterministic: false
